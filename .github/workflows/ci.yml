name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: package runs through npx and bunx without a global install
        shell: bash
        run: |
          bun run build:dist
          npm pack
          npx --yes ./skillcast-0.1.0.tgz check --root examples/basic
          bunx --bun ./skillcast-0.1.0.tgz check --root examples/basic
      - name: drifted example must fail
        shell: bash
        run: |
          if bun run src/bin.ts check --root examples/drifted; then echo "drift was not detected"; exit 1; fi
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          root: examples/basic
