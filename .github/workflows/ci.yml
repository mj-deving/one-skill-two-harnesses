name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: package runs through npx and bunx without a global install
        shell: bash
        run: |
          bun run build:dist
          git diff --exit-code dist/ || { echo "dist/bin.js is stale: run bun run build:dist and commit"; exit 1; }
          npm pack
          mkdir -p ../npm-consumer ../bun-consumer
          cp skillcast-0.1.0.tgz ../npm-consumer/ && cp skillcast-0.1.0.tgz ../bun-consumer/
          (cd ../npm-consumer && npm init -y >/dev/null && npm install ./skillcast-0.1.0.tgz && npx skillcast check --root "$GITHUB_WORKSPACE/examples/basic")
          (cd ../bun-consumer && bun init -y >/dev/null && bun add ./skillcast-0.1.0.tgz && bunx skillcast check --root "$GITHUB_WORKSPACE/examples/basic")
      - name: drifted example must fail
        shell: bash
        run: |
          if bun run src/bin.ts check --root examples/drifted; then echo "drift was not detected"; exit 1; fi
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          root: examples/basic
